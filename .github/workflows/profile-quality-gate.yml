name: "Profile Quality Gate"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: "Engineering Quality Audit"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Markdown Linting
        uses: davidanson/markdownlint-cli2-action@v16
        with:
          globs: "README.md"
        continue-on-error: true # Treat linting as a warning, not a blocker

      - name: Link Integrity Audit
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          args: --verbose --no-progress --exclude "mailto:.*" README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

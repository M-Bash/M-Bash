name: Update GitHub Activity

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour
  workflow_dispatch: # Allows manual run

permissions:
  contents: write # Crucial: Allows the bot to edit your README

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Activity Section
        uses: gautamkrishnar/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "⚡ Update GitHub activity [automated]"
          MAX_LINES: 10